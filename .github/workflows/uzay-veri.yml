name: uzay-veri
# Uzay Gunlugu: gunluk veri (APOD basliklari, EPIC, asteroitler, EONET, ISS TLE, GIBS) -> uzay/bugun.json
# Anahtarsiz kaynaklar; secret gerekmez. Bir kaynak cokerse onceki deger korunur.
on:
  schedule:
    - cron: "20 5 * * *"   # her gun 05:20 UTC (08:20 TR)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: uzay-veri
  cancel-in-progress: false
jobs:
  uret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: bugun.json uret
        run: python -I tools/uzay_veri.py
      - name: Degisiklik varsa commit + push
        run: |
          git config user.name "uzay-veri[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add uzay/bugun.json
          if git diff --cached --quiet; then echo "degisiklik yok"; exit 0; fi
          git commit -m "uzay: gunluk veri $(date -u +%F)"
          git pull --rebase -q && git push
