  @keyframes tlf { 0%,100% { translate:0 0; } 50% { translate:0 -7px; } }
  .tls { animation:tls 3.4s ease-in-out infinite; } @keyframes tls { 0%,100% { opacity:.25; } 50% { opacity:1; } }
  @media (prefers-reduced-motion:reduce) { .tlf,.tls { animation:none; } }
</style>
