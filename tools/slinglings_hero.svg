<svg viewBox="0 0 640 400" role="img" aria-label="A fluffy mail courier slung across space past a ringed planet toward a red mailbox">
<style>
  .slf { animation:slf 4.4s ease-in-out infinite; } .slf2 { animation-duration:5.6s; animation-delay:-1.2s; }
  @keyframes slf { 0%,100% { translate:0 0; } 50% { translate:0 -8px; } }
  .sls { animation:sls 3.4s ease-in-out infinite; } @keyframes sls { 0%,100% { opacity:.25; } 50% { opacity:1; } }
  .sld { animation:sld 1.6s linear infinite; } @keyframes sld { to { stroke-dashoffset:-28; } }
  @media (prefers-reduced-motion:reduce) { .slf,.sls,.sld { animation:none; } }
</style>
<defs><filter id="slgold" x="0" y="0" width="100%" height="100%"><feFlood flood-color="#F7C548" result="c"/><feBlend in="SourceGraphic" in2="c" mode="multiply" result="m"/><feComposite in="m" in2="SourceGraphic" operator="in"/></filter></defs>
